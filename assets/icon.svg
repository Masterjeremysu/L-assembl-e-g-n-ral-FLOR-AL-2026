<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="50%" stop-color="#172554"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#1e40af" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Fond arrondi PWA -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="111" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="4"/>

  <!-- Bouclier de sécurité & contrôle légal -->
  <path d="M256 70 C340 70, 395 105, 395 105 C395 240, 345 355, 256 415 C167 355, 117 240, 117 105 C117 105, 172 70, 256 70 Z" 
        fill="url(#shieldGrad)" stroke="url(#goldGrad)" stroke-width="8" stroke-linejoin="round"/>

  <!-- Bâtiment Résidence Le Floréal -->
  <g transform="translate(196, 175)" fill="#ffffff" opacity="0.9">
    <rect x="0" y="20" width="120" height="135" rx="4" fill="#1e293b" stroke="#93c5fd" stroke-width="4"/>
    <!-- Fenêtres du bâtiment -->
    <rect x="18" y="38" width="22" height="18" rx="2" fill="#60a5fa"/>
    <rect x="50" y="38" width="22" height="18" rx="2" fill="#60a5fa"/>
    <rect x="80" y="38" width="22" height="18" rx="2" fill="#60a5fa"/>
    
    <rect x="18" y="68" width="22" height="18" rx="2" fill="#60a5fa"/>
    <rect x="50" y="68" width="22" height="18" rx="2" fill="#fde047"/>
    <rect x="80" y="68" width="22" height="18" rx="2" fill="#60a5fa"/>
    
    <rect x="18" y="98" width="22" height="18" rx="2" fill="#60a5fa"/>
    <rect x="50" y="98" width="22" height="18" rx="2" fill="#60a5fa"/>
    <rect x="80" y="98" width="22" height="18" rx="2" fill="#60a5fa"/>
    <!-- Porte d'entrée -->
    <rect x="48" y="125" width="24" height="30" rx="3" fill="#3b82f6"/>
  </g>

  <!-- Coche de vote validé (Checkmark) -->
  <path d="M190 280 L235 325 L335 210" fill="none" stroke="url(#goldGrad)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- Texte FLORÉAL 2026 -->
  <text x="256" y="445" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="4">LE FLORÉAL</text>
  <text x="256" y="475" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" fill="#f59e0b" text-anchor="middle" letter-spacing="3">AG 2026 • CONSEIL SYNDICAL</text>
</svg>
