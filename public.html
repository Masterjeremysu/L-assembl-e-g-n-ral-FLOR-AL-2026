<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Écran Salle Vidéoprojecteur — AG 2026 Résidence Le Floréal</title>
  <link rel="icon" type="image/svg+xml" href="assets/icon.svg">
  <link rel="stylesheet" href="css/app-ui.css?v=5.0">
  <style>
    :root {
      --bg: #090d16;
      --card-bg: #111827;
      --border: #1f2937;
      --text: #f9fafb;
      --text-muted: #9ca3af;
      --primary: #3b82f6;
      --primary-light: #60a5fa;
      --success: #10b981;
      --success-bg: rgba(16, 185, 129, 0.15);
      --danger: #ef4444;
      --danger-bg: rgba(239, 68, 68, 0.15);
      --gold: #f59e0b;
      --gold-bg: rgba(245, 158, 11, 0.15);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      line-height: 1.4;
    }

    /* En-tête Rétroprojecteur Grand Format */
    header {
      background: #0f172a;
      border-bottom: 3px solid #1e293b;
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .brand-logo {
      font-size: 2.2rem;
      background: #1e293b;
      width: 54px;
      height: 54px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 12px;
      border: 1px solid #334155;
    }

    .brand-title {
      font-size: 1.45rem;
      font-weight: 900;
      letter-spacing: -0.02em;
      color: #ffffff;
      text-transform: uppercase;
    }

    .brand-sub {
      font-size: 0.95rem;
      color: var(--primary-light);
      font-weight: 700;
      letter-spacing: 0.05em;
    }

    .header-metrics {
      display: flex;
      align-items: center;
      gap: 1.5rem;
    }

    .header-pill {
      background: #1e293b;
      border: 1px solid #334155;
      padding: 0.5rem 1.25rem;
      border-radius: 50px;
      font-size: 1.05rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      color: #f1f5f9;
    }

    .clock-pill {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 1.35rem;
      color: #fde047;
      background: #1e293b;
      border-color: #ca8a04;
      font-weight: 800;
      padding: 0.4rem 1.2rem;
    }

    /* Zone Centrale de Projection */
    main {
      flex: 1;
      padding: 2rem 2.5rem;
      max-width: 1650px;
      width: 100%;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .projector-card {
      background: var(--card-bg);
      border: 2px solid var(--border);
      border-radius: 20px;
      padding: 2.5rem 3rem;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      position: relative;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .res-meta-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .res-number-badge {
      font-size: 1.6rem;
      font-weight: 900;
      background: #1d4ed8;
      color: #ffffff;
      padding: 0.5rem 1.6rem;
      border-radius: 12px;
      letter-spacing: 0.05em;
      box-shadow: 0 4px 14px rgba(29, 78, 216, 0.4);
    }

    .res-majority-badge {
      font-size: 1.25rem;
      font-weight: 800;
      background: #1e293b;
      color: #e2e8f0;
      border: 2px solid #3b82f6;
      padding: 0.5rem 1.4rem;
      border-radius: 12px;
    }

    .res-title {
      font-size: 2.6rem;
      font-weight: 900;
      line-height: 1.2;
      color: #ffffff;
      margin-bottom: 1.5rem;
      letter-spacing: -0.02em;
    }

    .res-description {
      font-size: 1.45rem;
      color: #cbd5e1;
      line-height: 1.65;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid #334155;
      padding: 1.75rem 2rem;
      border-radius: 14px;
      margin-bottom: 2rem;
      white-space: pre-wrap;
    }

    .res-description strong {
      color: #fde047;
      font-size: 1.55rem;
    }

    /* Jauge de Vote Publique XXL */
    .vote-gauge-section {
      margin-bottom: 2rem;
    }

    .vote-gauge-labels {
      display: flex;
      justify-content: space-between;
      font-size: 1.25rem;
      font-weight: 800;
      margin-bottom: 0.75rem;
      color: #cbd5e1;
    }

    .vote-gauge-track {
      height: 38px;
      background: #1e293b;
      border-radius: 20px;
      overflow: hidden;
      position: relative;
      border: 2px solid #334155;
    }

    .vote-gauge-bar {
      height: 100%;
      background: linear-gradient(90deg, #2563eb, #10b981);
      border-radius: 20px;
      transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .vote-gauge-threshold {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 4px;
      background: #fde047;
      box-shadow: 0 0 12px #fde047;
    }

    /* Proclamation de Résultat XXL */
    .proclamation-banner {
      padding: 1.75rem 2rem;
      border-radius: 16px;
      text-align: center;
      font-weight: 900;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1.25rem;
      letter-spacing: 0.02em;
    }

    .proclamation-banner.en-cours {
      background: rgba(30, 41, 59, 0.8);
      border: 2px dashed #475569;
      color: #94a3b8;
      font-size: 1.6rem;
    }

    .proclamation-banner.adoptee {
      background: linear-gradient(135deg, #065f46 0%, #047857 100%);
      border: 3px solid #34d399;
      color: #ffffff;
      font-size: 2.2rem;
      box-shadow: 0 10px 30px rgba(16, 185, 129, 0.35);
    }

    .proclamation-banner.rejetee {
      background: linear-gradient(135deg, #991b1b 0%, #b91c1c 100%);
      border: 3px solid #f87171;
      color: #ffffff;
      font-size: 2.2rem;
      box-shadow: 0 10px 30px rgba(239, 68, 68, 0.35);
    }

    .elu-proclamation-card {
      background: linear-gradient(135deg, rgba(245, 158, 11, 0.18) 0%, rgba(217, 119, 6, 0.12) 100%);
      border: 2px solid #f59e0b;
      border-radius: 18px;
      padding: 1.25rem 2rem;
      margin-bottom: 1.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1.2rem;
      flex-wrap: wrap;
      text-align: center;
      box-shadow: 0 10px 28px rgba(245, 158, 11, 0.22);
    }

    .elu-proclamation-label {
      font-size: 1.15rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #fcd34d;
    }

    .elu-proclamation-name {
      font-size: 2.3rem;
      font-weight: 900;
      color: #ffffff;
      letter-spacing: -0.01em;
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.4);
    }

    /* ===================================================
       VUE SIMULATION FINANCIÈRE TRAVAUX XXL
       =================================================== */
    .finance-header {
      background: linear-gradient(135deg, #1e3a8a 0%, #1e40af 100%);
      border: 2px solid #3b82f6;
      border-radius: 16px;
      padding: 1.5rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .finance-big-val {
      font-size: 2.6rem;
      font-weight: 900;
      color: #fde047;
    }

    .finance-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 1.25rem;
      margin-bottom: 2rem;
    }

    .finance-card {
      background: #1e293b;
      border: 2px solid #334155;
      border-radius: 14px;
      padding: 1.4rem;
      text-align: center;
      transition: transform 0.2s ease;
    }

    .finance-card.highlight {
      border-color: #f59e0b;
      background: #252836;
      box-shadow: 0 0 20px rgba(245, 158, 11, 0.2);
    }

    .finance-type-title {
      font-size: 1.2rem;
      font-weight: 800;
      color: #fde047;
      margin-bottom: 0.3rem;
    }

    .finance-type-sub {
      font-size: 0.95rem;
      color: #94a3b8;
      margin-bottom: 0.75rem;
    }

    .finance-type-total {
      font-size: 2rem;
      font-weight: 900;
      color: #ffffff;
      margin-bottom: 0.3rem;
    }

    .finance-type-echeance {
      font-size: 1.15rem;
      font-weight: 800;
      color: #34d399;
    }

    /* Carte Copropriétaire Spécifique en Direct */
    .copro-spotlight-card {
      background: linear-gradient(135deg, #1e293b, #0f172a);
      border: 3px solid #f59e0b;
      border-radius: 16px;
      padding: 1.75rem 2.25rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1.5rem;
      box-shadow: 0 10px 30px rgba(245, 158, 11, 0.25);
    }

    .copro-spotlight-nom {
      font-size: 2rem;
      font-weight: 900;
      color: #ffffff;
    }

    .copro-spotlight-lots {
      font-size: 1.15rem;
      color: #cbd5e1;
      margin-top: 0.3rem;
    }

    .copro-spotlight-tant {
      background: #f59e0b;
      color: #0f172a;
      padding: 0.2rem 0.8rem;
      border-radius: 6px;
      font-weight: 800;
    }

    /* Contrôles discrets bas de page */
    .projector-footer {
      padding: 0.75rem 2rem;
      background: #090d16;
      border-top: 1px solid #1e293b;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
      color: #64748b;
    }

    .btn-fs {
      background: #1e293b;
      color: #f1f5f9;
      border: 1px solid #475569;
      padding: 0.4rem 0.9rem;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 700;
    }
    .btn-fs:hover { background: #334155; }
  </style>
</head>
<body>

  <!-- EN-TÊTE RÉCAPITULATIF OFFICIEL -->
  <header>
    <div class="brand">
      <div class="brand-logo">🏢</div>
      <div>
        <div class="brand-title">Résidence Le Floréal — Assemblée Générale 2026</div>
        <div class="brand-sub">Ordre du Jour Officiel & Scrutins en Séance</div>
      </div>
    </div>
    <div class="header-metrics">
      <div class="header-pill" id="headerQuorumPill">
        <span>👥 Quorum :</span>
        <strong id="headerQuorumTant">-- tantièmes</strong>
        <span id="headerQuorumPct" style="color:var(--primary-light);">(0%)</span>
      </div>
      <div class="header-pill clock-pill" id="digitalClock">--:--:--</div>
    </div>
  </header>

  <!-- CONTENU PRINCIPAL PLEIN ÉCRAN -->
  <main id="projectorMain">
    <div class="projector-card" id="projectorContentCard">
      <!-- Rempli dynamiquement -->
    </div>
  </main>

  <!-- PIED DE PAGE DISCRET -->
  <footer class="projector-footer">
    <div>Diffusion en direct • Synchronisation automatique avec la console de vote du Conseil Syndical</div>
    <div style="display:flex; gap:1rem; align-items:center;">
      <span id="syncStatusIndicator" style="color:#10b981;">● Connecté en direct</span>
      <button class="btn-fs" onclick="toggleFullScreen()">⛶ Plein Écran (F11)</button>
    </div>
  </footer>

  <script>
    const STORAGE_KEY = 'AG_CS_VOTES_DATA_FLOREAL_2026_V2';
    const DISPLAY_KEY = 'AG_PUBLIC_DISPLAY_STATE';

    let channel = null;
    try {
      channel = new BroadcastChannel('floreal_ag_channel');
      channel.onmessage = (event) => {
        handleStateUpdate(event.data);
      };
    } catch (e) {
      console.log('BroadcastChannel non supporté, fallback localStorage');
    }

    // Écoute des mises à jour directes de stockage local (multi-fenêtres / double écran)
    window.addEventListener('storage', (e) => {
      if (e.key === DISPLAY_KEY || e.key === STORAGE_KEY) {
        refreshDisplay();
      }
    });

    // Horloge digitale en direct
    setInterval(() => {
      const now = new Date();
      document.getElementById('digitalClock').innerText = now.toLocaleTimeString('fr-FR', {
        hour: '2-digit', minute: '2-digit', second: '2-digit'
      });
    }, 1000);

    function toggleFullScreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen().catch(() => {});
      }
    }

    // Touches raccourcis plein écran
    window.addEventListener('keydown', (e) => {
      if (e.key === 'f' || e.key === 'F') {
        toggleFullScreen();
      }
    });

    function getAppData() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        return raw ? JSON.parse(raw) : null;
      } catch (e) {
        return null;
      }
    }

    function getDisplayState() {
      try {
        const raw = localStorage.getItem(DISPLAY_KEY);
        return raw ? JSON.parse(raw) : null;
      } catch (e) {
        return null;
      }
    }

    function handleStateUpdate(data) {
      if (!data) return;
      refreshDisplay();
    }

    function refreshDisplay() {
      const appData = getAppData();
      if (!appData) {
        renderWaitingScreen();
        return;
      }

      // Quorum en-tête
      const totalCopro = Number(appData.config?.totalTantiemes) || 97478;
      const presents = Number(appData.config?.presentTantiemes) || 0;
      const pct = totalCopro > 0 ? ((presents / totalCopro) * 100).toFixed(1) : '0';
      document.getElementById('headerQuorumTant').innerText = `${presents.toLocaleString('fr-FR')} / ${totalCopro.toLocaleString('fr-FR')} t.`;
      document.getElementById('headerQuorumPct').innerText = `(${pct}%)`;

      const displayState = getDisplayState();

      // Mode Spécifique : Simulation Financière Travaux
      if (displayState && displayState.mode === 'FINANCE') {
        renderFinanceScreen(displayState.finance, totalCopro, appData);
        return;
      }

      // Mode Résolution en cours
      const resId = displayState?.activeResId || appData.config?.activeSeanceResId || (appData.resolutions && appData.resolutions[0]?.id);
      const res = (appData.resolutions || []).find(r => r.id === resId) || appData.resolutions[0];

      if (!res) {
        renderWaitingScreen();
        return;
      }

      renderResolutionScreen(res, totalCopro, presents);
    }

    function renderResolutionScreen(res, totalCopro, presents) {
      const container = document.getElementById('projectorContentCard');
      const pour = Number(res.tantiemesPour) || 0;
      const contre = Number(res.tantiemesContre) || 0;
      const abs = Number(res.tantiemesAbs) || 0;
      const totalExprime = pour + contre + abs;
      const isAdopted = res.status === 'ADOPTEE';
      const isRejected = res.status === 'REJETEE';
      const hasVoted = isAdopted || isRejected;

      // Calcul jauge majorité
      let seuilLabel = '';
      let targetTantiemes = 0;
      if (res.majorite === 'Article 24') {
        targetTantiemes = (pour + contre > 0) ? Math.floor((pour + contre) / 2) + 1 : Math.floor(presents / 2) + 1;
        seuilLabel = `Article 24 (Majorité des voix exprimées)`;
      } else if (res.majorite.includes('Article 25')) {
        targetTantiemes = Math.floor(totalCopro / 2) + 1;
        seuilLabel = `Article 25 (Majorité absolue : ${targetTantiemes.toLocaleString('fr-FR')} voix)`;
      } else if (res.majorite.includes('Article 26')) {
        targetTantiemes = Math.floor(totalCopro * 2 / 3) + 1;
        seuilLabel = `Article 26 (Double majorité : ${targetTantiemes.toLocaleString('fr-FR')} voix)`;
      } else {
        seuilLabel = res.majorite;
      }

      const gaugePct = totalCopro > 0 ? Math.min(100, ((pour / (targetTantiemes || 1)) * 100)).toFixed(1) : 0;

      let bannerHtml = '';
      const heureVoteStr = res.heureVote || res.voteTime || '';
      if (isAdopted) {
        bannerHtml = `
          <div class="proclamation-banner adoptee">
            <span>✅</span>
            <span>RÉSOLUTION ADOPTÉE</span>
            <span style="font-size:1.6rem; font-weight:700;">(${pour.toLocaleString('fr-FR')} POUR / ${contre.toLocaleString('fr-FR')} CONTRE)</span>
            ${heureVoteStr ? `<span style="font-size:1.3rem; opacity:0.9;">• Votée à ${heureVoteStr}</span>` : ''}
          </div>
        `;
      } else if (isRejected) {
        bannerHtml = `
          <div class="proclamation-banner rejetee">
            <span>❌</span>
            <span>RÉSOLUTION REJETÉE</span>
            <span style="font-size:1.6rem; font-weight:700;">(${pour.toLocaleString('fr-FR')} POUR / ${contre.toLocaleString('fr-FR')} CONTRE)</span>
            ${heureVoteStr ? `<span style="font-size:1.3rem; opacity:0.9;">• Votée à ${heureVoteStr}</span>` : ''}
          </div>
        `;
      } else {
        bannerHtml = `
          <div class="proclamation-banner en-cours">
            <span>⏱️</span>
            <span>DÉBAT EN SALLE & SCRUTIN EN COURS...</span>
          </div>
        `;
      }

      let descText = res.description || 'Texte de la délibération soumis au vote de l\'Assemblée Générale.';
      if (res.eluNom && descText.includes('...')) {
        descText = descText.replace('...', res.eluNom);
      }

      const eluBannerHtml = res.eluNom ? `
        <div class="elu-proclamation-card">
          <span style="font-size:2.4rem;">👑</span>
          <div>
            <div class="elu-proclamation-label">${isAdopted ? 'Élu(e) / Désigné(e) par l\'Assemblée' : 'Candidat(e) proposé(e) au vote'}</div>
            <div class="elu-proclamation-name">${escapeHtml(res.eluNom)}</div>
          </div>
        </div>
      ` : '';

      container.innerHTML = `
        <div class="res-meta-bar">
          <div class="res-number-badge">RÉSOLUTION N° ${escapeHtml(res.number)}</div>
          <div class="res-majority-badge">⚖️ ${escapeHtml(seuilLabel)}</div>
        </div>

        <h1 class="res-title">${escapeHtml(res.title)}</h1>

        <div class="res-description">${formatDescription(descText)}</div>

        ${eluBannerHtml}

        ${hasVoted ? `
          <div class="vote-gauge-section">
            <div class="vote-gauge-labels">
              <div>Voix POUR : <span style="color:#10b981;">${pour.toLocaleString('fr-FR')} t.</span> (${totalCopro > 0 ? ((pour/totalCopro)*100).toFixed(1) : 0}%)</div>
              <div>Voix CONTRE : <span style="color:#ef4444;">${contre.toLocaleString('fr-FR')} t.</span> • ABSTENTIONS : <span>${abs.toLocaleString('fr-FR')} t.</span></div>
            </div>
            <div class="vote-gauge-track">
              <div class="vote-gauge-bar" style="width: ${Math.min(100, (pour / (targetTantiemes || 1)) * 100)}%;"></div>
            </div>
          </div>
        ` : ''}

        ${bannerHtml}
      `;
    }

    function renderFinanceScreen(finance, totalCopro, appData) {
      const container = document.getElementById('projectorContentCard');
      const budget = Number(finance?.budget) || 50000;
      const deduction = Number(finance?.deduction) || 0;
      const netBudget = Math.max(0, budget - deduction);
      const echeances = Number(finance?.echeanceCount) || 4;
      const echeanceLabel = finance?.echeanceLabel || "4 appels trimestriels";

      // Valeur unitaire mathématique stricte au tantième
      const valeurParTantieme = totalCopro > 0 ? (netBudget / totalCopro) : 0;
      const echeanceParTantieme = valeurParTantieme / echeances;

      // Paliers de tantièmes réels pour repères en séance
      const paliers = [5, 44, 200, 300, 350, 400, 450, 500, 600, 800];

      let spotlightHtml = '';
      if (finance?.targetCopro) {
        const c = finance.targetCopro;
        spotlightHtml = `
          <div class="copro-spotlight-card">
            <div>
              <div style="font-size:1.1rem; font-weight:800; text-transform:uppercase; color:#f59e0b; letter-spacing:0.05em;">🎯 ESTIMATION NOMINATIVE EN DIRECT</div>
              <div class="copro-spotlight-nom">${escapeHtml(c.nom)}</div>
              <div class="copro-spotlight-lots">${escapeHtml(c.lots || 'Lots de copropriété')} • <span class="copro-spotlight-tant">${c.tantiemes} tantièmes en propre</span></div>
            </div>
            <div style="text-align:right;">
              <div style="font-size:1.2rem; color:#cbd5e1;">Quote-part totale exacte : <strong style="font-size:2.8rem; color:#fde047; font-weight:900;">${c.total.toLocaleString('fr-FR', { minimumFractionDigits: 2, maximumFractionDigits: 2 })} €</strong></div>
              <div style="font-size:1.45rem; font-weight:800; color:#34d399; margin-top:6px;">Soit ${c.echeance.toLocaleString('fr-FR', { minimumFractionDigits: 2, maximumFractionDigits: 2 })} € / appel (${echeances} échéances)</div>
            </div>
          </div>
        `;
      }

      container.innerHTML = `
        <div class="finance-header">
          <div>
            <div style="font-size:1.1rem; font-weight:800; text-transform:uppercase; color:#93c5fd; letter-spacing:0.05em;">SIMULATEUR FINANCIER EN SÉANCE</div>
            <h1 style="font-size:2.4rem; font-weight:900; color:#ffffff; margin:4px 0;">Impact Travaux & Quote-Part au Tantième</h1>
            <div style="font-size:1.2rem; color:#e2e8f0;">
              ${deduction > 0 ? `Budget brut : ${budget.toLocaleString('fr-FR')} € • Déduction Fonds Alur / Aides : <span style="color:#86efac;">-${deduction.toLocaleString('fr-FR')} €</span> • ` : ''}
              Échéancier : <strong>${escapeHtml(echeanceLabel)}</strong>
            </div>
          </div>
          <div style="text-align:right;">
            <div style="font-size:1rem; color:#93c5fd; font-weight:700;">VALEUR EXACTE D'UN TANTIÈME :</div>
            <div class="finance-big-val">${valeurParTantieme.toFixed(4)} € / t.</div>
            <div style="font-size:1.1rem; font-weight:800; color:#34d399;">~${echeanceParTantieme.toFixed(4)} € / t. par échéance</div>
          </div>
        </div>

        ${spotlightHtml}

        <div style="background:rgba(245, 158, 11, 0.12); border:1px solid #ca8a04; border-radius:10px; padding:0.9rem 1.4rem; margin:${finance?.targetCopro ? '1.5rem' : '0'} 0 1.25rem; font-size:1.05rem; color:#fef3c7; line-height:1.5;">
          ℹ️ <strong>Règle légale (Art. 5 Loi de 1965) :</strong> Dans notre résidence, les tantièmes de chaque appartement sont uniques et dépendent de sa surface exacte, de son étage et de son orientation. Donnez vos tantièmes au micro ou indiquez votre nom pour votre montant certifié au centime près !
        </div>

        <div style="font-size:1.25rem; font-weight:800; color:#f8fafc; margin-bottom:0.75rem;">
          📊 Échelle de conversion rapide selon vos tantièmes réels :
        </div>

        <div class="finance-grid">
          ${paliers.map(tant => {
            const total = (netBudget * tant) / totalCopro;
            const parEcheance = total / echeances;
            return `
              <div class="finance-card">
                <div class="finance-type-title">${tant} tantièmes</div>
                <div class="finance-type-sub">${tant <= 5 ? 'Place parking' : (tant <= 44 ? 'Box garage' : 'Appartement / Lots')}</div>
                <div class="finance-type-total">${total.toLocaleString('fr-FR', { minimumFractionDigits: 2, maximumFractionDigits: 2 })} €</div>
                <div class="finance-type-echeance">~${parEcheance.toLocaleString('fr-FR', { minimumFractionDigits: 2, maximumFractionDigits: 2 })} € / appel</div>
              </div>
            `;
          }).join('')}
        </div>
      `;
    }

    function renderWaitingScreen() {
      const container = document.getElementById('projectorContentCard');
      container.innerHTML = `
        <div style="text-align:center; padding:5rem 2rem;">
          <div style="font-size:4rem; margin-bottom:1rem;">🏢</div>
          <h1 style="font-size:3rem; font-weight:900; color:#ffffff; margin-bottom:1rem;">ASSEMBLÉE GÉNÉRALE 2026</h1>
          <p style="font-size:1.6rem; color:#94a3b8;">La séance va bientôt débuter • En attente de délibération...</p>
        </div>
      `;
    }

    function formatDescription(desc) {
      if (!desc) return '';
      // Met en valeur les montants en euros et les entreprises
      let formatted = escapeHtml(desc);
      formatted = formatted.replace(/(\d+[\s\d]*[.,]?\d*\s*€)/g, '<strong>$1</strong>');
      return formatted;
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    // Chargement initial
    window.onRemoteDisplayStateUpdate = handleStateUpdate;
    refreshDisplay();
    // Boucle de rafraîchissement doux
    setInterval(refreshDisplay, 2000);
  </script>
  <!-- Système UI & Client SDK Supabase BDD Cloud PostgreSQL pour le Rétroprojecteur -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/ui-dialogs.js?v=5.0"></script>
  <script src="js/supabase-client.js?v=4.2"></script>
</body>
</html>
